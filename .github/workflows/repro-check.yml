name: Reproducibility Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify derived claims
        run: python scripts/verify_derived_claims.py

      - name: Audit P0 claim registry
        run: python scripts/audit_claim_registry.py

      - name: Check canonical terminology
        run: python scripts/check_canonical_terms.py
